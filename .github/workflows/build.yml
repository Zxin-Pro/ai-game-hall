name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund
        env:
          CI: '1'

      - name: Expo prebuild (generate android project)
        working-directory: app
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'

      - name: Verify autolinking (catch missing expo modules early)
        working-directory: app
        run: |
          npx expo-modules-autolinking resolve --platform android > /dev/null
          echo "autolinking ok"
          grep -c "expo-module-gradle-plugin" android/settings.gradle || true

      - name: Build release APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        env:
          CI: '1'
          GRADLE_OPTS: '-Xmx4g -Dorg.gradle.daemon=false'

      - name: Show APK info
        working-directory: app/android
        run: |
          ls -lh app/build/outputs/apk/release/
          echo "--- sha256 ---"
          sha256sum app/build/outputs/apk/release/*.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-game-hall-apk
          path: app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Rename for release
        run: |
          mkdir -p out
          cp app/android/app/build/outputs/apk/release/*.apk out/ai-game-hall.apk
          ls -lh out/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AI 游戏厅 latest
          body: |
            自动构建的 Android 安装包。
            安装后如果后端没起，App 会进入离线演示模式。
          files: out/ai-game-hall.apk
