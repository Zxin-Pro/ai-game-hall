name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ★ 每次构建都自动涨版本号，不用人手改：
      #     versionCode = 1000 + 构建序号（只增不减，Android 才认是新版本）
      #     版本名     = 1.<构建序号>
      #   同时塞进 expo.extra，App 运行时能读到自己的版本
      - name: 自动递增版本号
        run: |
          CODE=$((1000 + ${{ github.run_number }}))
          NAME="1.${{ github.run_number }}"
          echo "本次版本：$NAME（versionCode $CODE）"
          echo "APP_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          NEW_CODE="$CODE" NEW_NAME="$NAME" node -e '
            const fs = require("fs");
            const p = "app/app.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.expo.version = process.env.NEW_NAME;
            j.expo.android = j.expo.android || {};
            j.expo.android.versionCode = Number(process.env.NEW_CODE);
            j.expo.extra = j.expo.extra || {};
            j.expo.extra.versionCode = Number(process.env.NEW_CODE);
            j.expo.extra.versionName = process.env.NEW_NAME;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            console.log("app.json 已写入:", j.expo.version, j.expo.android.versionCode);
          '
          grep -n '"version"\|versionCode' app/app.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund
        env:
          CI: '1'

      - name: Expo prebuild (generate android project)
        working-directory: app
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'

      # ★ 关键：用固定的 keystore 覆盖模板生成的那份，
      #   保证每次构建签名完全一致（用户要求：更新软件不能变签名）
      - name: Pin signing keystore
        working-directory: app/android/app
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          ls -l debug.keystore

          # 只比对去掉冒号后的十六进制串，避免空格/换行/CR 之类看不见的差异
          norm() { tr -d ' :\r\n\t' | tr 'a-f' 'A-F'; }
          EXPECTED_HEX="5E8F16062EA3CD2C4A0D547876BAA6F38CABF625"

          RAW=$(keytool -list -v -keystore debug.keystore \
            -storepass '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' \
            -alias '${{ secrets.ANDROID_KEY_ALIAS }}' \
            | awk '/SHA1:/ {print $2; exit}')
          ACTUAL_HEX=$(printf '%s' "$RAW" | norm)

          echo "keystore SHA1 = [$RAW]"
          echo "归一化后      = [$ACTUAL_HEX]"
          if [ "$ACTUAL_HEX" != "$EXPECTED_HEX" ]; then
            echo "::error::keystore 指纹不对，签名会变！期望 $EXPECTED_HEX"
            exit 1
          fi
          echo "keystore 指纹正确 ✓"

      - name: Verify autolinking (catch missing expo modules early)
        working-directory: app
        run: |
          npx expo-modules-autolinking resolve --platform android > /dev/null
          echo "autolinking ok"

      - name: Build release APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        env:
          CI: '1'
          GRADLE_OPTS: '-Xmx4g -Dorg.gradle.daemon=false'

      - name: Show APK info
        working-directory: app/android
        run: |
          ls -lh app/build/outputs/apk/release/
          echo "--- sha256 ---"
          sha256sum app/build/outputs/apk/release/*.apk

      # ★ 构建后再验一次 APK 实际签名（用 Android 官方 apksigner，v1/v2/v3 都认）
      - name: Verify APK signature
        working-directory: app/android
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "检查 $APK"

          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          echo "apksigner = $APKSIGNER"

          if [ -z "$APKSIGNER" ]; then
            echo "::warning::没找到 apksigner，跳过签名校验"
            exit 0
          fi

          REPORT=$("$APKSIGNER" verify --print-certs "$APK" 2>&1)
          echo "$REPORT"

          EXPECTED_HEX="5E8F16062EA3CD2C4A0D547876BAA6F38CABF625"
          # 注意：不能按冒号切字段，'SHA-1 digest' 里的 '-' 会被当成分隔符
          # 这里直接抓 'certificate SHA-1 digest: ' 后面的那串
          ACTUAL_HEX=$(printf '%s' "$REPORT" \
            | grep -i 'certificate SHA-1 digest' \
            | head -1 \
            | sed 's/.*digest: *//' \
            | tr -d ' :\r\n\t' | tr 'a-f' 'A-F')

          echo "APK 签名 SHA1 = [$ACTUAL_HEX]"
          echo "期望          = [$EXPECTED_HEX]"
          if [ "$ACTUAL_HEX" != "$EXPECTED_HEX" ]; then
            echo "::error::APK 签名与预期不符，会覆盖安装失败"
            exit 1
          fi
          echo "APK 签名校验通过 ✓"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-game-hall-apk
          path: app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Rename for release
        run: |
          mkdir -p out
          cp app/android/app/build/outputs/apk/release/*.apk out/ai-game-hall.apk
          ls -lh out/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AI 游戏厅 ${{ env.APP_VERSION_NAME }}
          body: |
            AI 游戏厅 ${{ env.APP_VERSION_NAME }}（versionCode ${{ env.APP_VERSION_CODE }}）

            自动构建的 Android 安装包。
            签名固定（SHA1 5E:8F:16:06:2E:A3:CD:2C:4A:0D:54:78:76:BA:A6:F3:8C:AB:F6:25），
            可直接覆盖安装旧版本。
          files: out/ai-game-hall.apk

      # ★ 构建完直接把包和版本号登记到服务端：
      #   管理后台立刻看得到，App 启动查 /api/app/latest 就会提示更新。
      #   没配 GAMEHALL_URL / GAMEHALL_ADMIN_KEY 就只发 GitHub，不算失败。
      - name: 登记新版本到服务端
        run: |
          URL="${{ secrets.GAMEHALL_URL }}"
          KEY="${{ secrets.GAMEHALL_ADMIN_KEY }}"
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::warning::没配 GAMEHALL_URL / GAMEHALL_ADMIN_KEY，跳过服务端登记"
            exit 0
          fi
          NOTE=$(git log -1 --pretty=%s)
          echo "登记 $APP_VERSION_NAME ($APP_VERSION_CODE) 到 $URL"
          # ★ 必须去掉 Expect: 100-continue：大包上传时 curl 会先等服务器回 100，
          #   而链路里这一等会直接挂住（表现为等满超时、0 字节）
          curl -sS --http1.1 -m 900 -X POST "$URL/api/admin/publish-apk" \
            -H "x-admin-key: $KEY" \
            -H 'Expect:' \
            -F "file=@out/ai-game-hall.apk" \
            -F "versionCode=$APP_VERSION_CODE" \
            -F "versionName=$APP_VERSION_NAME" \
            -F "note=$NOTE" \
            -w "\nHTTP %{http_code}\n"
